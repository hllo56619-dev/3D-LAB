<title>Thí nghiệm hóa học 3D</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#262626;--bar:#2c2c2c;--fg:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#eq{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:8%;right:8%;text-align:center;font-size:12px;line-height:1.35;color:#e8e8e8;pointer-events:none}
#lab{position:fixed;left:6%;top:56%;font-size:11px;line-height:1.5;color:#cfcfcf;pointer-events:none}
sub{font-size:.72em;line-height:0}
#bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:48px;background:rgba(44,44,44,.94);border-radius:8px;display:flex;justify-content:space-around;align-items:center;z-index:5;max-width:520px;margin:0 auto}
#bar button{background:none;border:0;width:56px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
#bar button.on{background:rgba(255,255,255,.12)}
button:focus-visible{outline:2px solid #8ab4f8;outline-offset:1px}
#cat{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(94vw,520px);background:rgba(34,34,34,.96);border-radius:10px;z-index:4;display:none;flex-direction:column;overflow:hidden;touch-action:pan-y}
#cat.open{display:flex}
#top{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 8px}
#sw{flex:1;border-bottom:1.5px solid #eee;padding-bottom:2px}
#sw i{display:block;font-size:9px;color:#bbb}
#q{width:100%;background:none;border:0;outline:0;color:#fff;font:15px Georgia,serif;padding:2px 0;-webkit-user-select:text;user-select:text}
#x{background:none;border:0;cursor:pointer;width:36px;height:36px;display:grid;place-items:center}
#filters{display:flex;gap:5px;padding:0 8px 7px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;touch-action:pan-x}#filters::-webkit-scrollbar{display:none}#filters button{white-space:nowrap;background:transparent;border:1px solid #444;color:#bfbfbf;border-radius:99px;padding:5px 9px;font:11px Georgia,serif}#filters button.active{background:#dedede;border-color:#dedede;color:#111}
#grid{overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px 2px;padding:8px 8px 14px;align-content:start;touch-action:pan-y;overscroll-behavior:contain}
.t{background:none;border:0;color:#ddd;font:12px Georgia,serif;text-align:center;cursor:pointer;padding:4px 0;min-width:0;overflow-wrap:anywhere}
.t svg{width:46px;height:46px;display:block;margin:0 auto 2px}
#none{grid-column:1/-1;text-align:center;color:#888;font-size:13px;padding:30px 0}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:#000;z-index:9;font-size:15px}
</style>
</head>

function tex(kind){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
 if(kind){g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.7,'rgba(255,255,255,.18)');g.addColorStop(.9,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)')}
 else{g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)')}
 x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const T0=tex(0),T1=tex(1);
function Pool(n,add,tx,kill){
 const g=new THREE.BufferGeometry(),P=new Float32Array(n*3),Cl=new Float32Array(n*3),Z=new Float32Array(n),A=new Float32Array(n);
 [['position',P,3],['col',Cl,3],['sz',Z,1],['al',A,1]].forEach(([k,a,s])=>g.setAttribute(k,new THREE.BufferAttribute(a,s)));
 const m=new THREE.ShaderMaterial({uniforms:{map:{value:tx},sc:SC},transparent:true,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,
  vertexShader:'attribute vec3 col;attribute float sz,al;uniform float sc;varying vec3 vc;varying float va;void main(){vc=col;va=al;vec4 m=modelViewMatrix*vec4(position,1.);gl_PointSize=sz*sc/-m.z;gl_Position=projectionMatrix*m;}',
  fragmentShader:'uniform sampler2D map;varying vec3 vc;varying float va;void main(){gl_FragColor=vec4(vc,texture2D(map,gl_PointCoord).a*va);}'});
 const o=new THREE.Points(g,m);o.frustumCulled=false;o.renderOrder=8;S.add(o);
 const V=new Float32Array(n*3),Lf=new Float32Array(n),Mx=new Float32Array(n),S0=new Float32Array(n),G=new Float32Array(n),C0=new Float32Array(n*3),C1=new Float32Array(n*3),A0=new Float32Array(n),GR=new Float32Array(n);let k=0;
 return{emit(e){const i=k=(k+1)%n;P.set([e.x,e.y,e.z],i*3);V.set([e.vx||0,e.vy||0,e.vz||0],i*3);Lf[i]=Mx[i]=e.life;S0[i]=e.size;C0.set(e.c0,i*3);C1.set(e.c1||e.c0,i*3);A0[i]=e.a===undefined?1:e.a;G[i]=e.g||0;GR[i]=e.grow||0},
 update(dt){for(let i=0;i<n;i++){if(Lf[i]<=0){A[i]=0;continue}Lf[i]-=dt;const j=i*3;
  if(Lf[i]<=0||(kill&&kill(P[j],P[j+1],P[j+2]))){Lf[i]=0;A[i]=0;continue}
  const t=1-Lf[i]/Mx[i];V[j+1]+=G[i]*dt;P[j]+=V[j]*dt;P[j+1]+=V[j+1]*dt;P[j+2]+=V[j+2]*dt;
  for(let q=0;q<3;q++)Cl[j+q]=C0[j+q]+(C1[j+q]-C0[j+q])*t;
  A[i]=A0[i]*(t<.1?t/.1:1-(t-.1)/.9);Z[i]=S0[i]*(1+GR[i]*t)}
  ['position','col','sz','al'].forEach(a=>g.attributes[a].needsUpdate=true)}}}

function liquidTarget(){if(st.ovr)return new THREE.Color(st.ovr);const ls=st.contents.filter(i=>BY[i]&&BY[i].t==='l');if(!ls.length)return st.col.clone();

function startReaction(r){
 if(st.rx)return;
 st.rx={r,t:0,col0:st.col.clone()};st.ovr=r.col;st.gasType=r.gas||null;eqEl.innerHTML=sub(r.eq);
 const keep=new Set(r.preserve||[]),consume=new Set(r.need.filter(i=>!keep.has(i)));

function add(id){const d=BY[id];if(!d)return;if(st.ovr&&!st.rx)st.ovr=null;

 else if(d.t==='g'){const c=rgb(d.c);for(let i=0;i<70;i++)setTimeout(()=>grain.emit({x:rnd(.3,1.3),y:5.5,z:rnd(-.3,.3),vx:rnd(-.6,0),vy:-rnd(1,2.5),life:rnd(1.2,2),size:rnd(.3,.6),c0:c,a:.4,grow:1.5}),i*14);
  setTimeout(()=>{st.contents.push(id);labels();for(let i=0;i<14;i++)bub.emit({x:rnd(-.8,.8),y:.2,z:rnd(-.8,.8),vy:rnd(.6,1),life:6,size:rnd(.08,.16),c0:[1,1,1],a:.7});check()},1100)}
 else{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,0),new THREE.MeshLambertMaterial({color:d.c,flatShading:true}));
  m.scale.set(rnd(.9,1.3),rnd(.7,1),rnd(.9,1.3));m.position.set(.5,6.2,0);S.add(m);rocks.push({m,id,vy:0,st:'fall',t:0,dis:false,pushed:false})}}

function clearAll(){st.contents=[];lvT=0;st.rx=null;st.fire=0;st.bub=0;st.ovr=null;st.stream=0;st.temp=25;st.gasType=null;clearSediment();eqEl.innerHTML='';labels();
 rocks.splice(0).forEach(k=>{S.remove(k.m);k.m.geometry.dispose();k.m.material.dispose()})}

/* ============ main loop ============ */
let last=performance.now(),time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;if(document.hidden)return;
 lv+=(lvT-lv)*Math.min(1,dt*(st.pour?1:2.5));if(Math.abs(lvT-lv)<.001)lv=lvT;
 liq.visible=top.visible=lv>.02;liq.scale.y=Math.max(lv,.001);top.position.y=lv;
 const tc=liquidTarget();st.col.lerp(tc,Math.min(1,dt*(st.rx?.55:2.5)));liqMat.color.copy(st.col);topMat.color.copy(st.col).multiplyScalar(1.12);
 st.temp+=st.heat?(st.temp<130?24*dt:0):(st.temp>25?-10*dt:0);if(st.temp<25)st.temp=25;glassMat.uniforms.uW.value=st.heat?Math.min(1,(st.temp-25)/60):Math.max(0,glassMat.uniforms.uW.value-dt);
 if((st.chk-=dt)<=0){st.chk=.25;check()}
 /* dòng chất lỏng */
 if(st.stream>0){st.stream-=dt;const c=[st.sc.r,st.sc.g,st.sc.b],tx=.1,tz=0,ty=lv+.05;
  for(let i=0;i<9;i++){const sx=1.25+rnd(-.12,.12),sy=6.4,dx=tx-sx,dy=ty-sy,L2=Math.hypot(dx,dy),sp=7.5;
   grain.emit({x:sx,y:sy,z:rnd(-.1,.1),vx:dx/L2*sp,vy:dy/L2*sp,vz:0,life:L2/sp,size:rnd(.06,.11),c0:c,a:.9})}
  if(Math.random()<.35){ripple(rnd(-.15,.25),rnd(-.1,.1))}
  for(let i=0;i<2;i++)grain.emit({x:tx+rnd(-.1,.1),y:ty,z:rnd(-.1,.1),vx:rnd(-.8,.8),vy:rnd(1,2),vz:rnd(-.8,.8),life:.5,size:.05,c0:c,a:.8,g:-7})}
 /* chất rắn */
 for(let i=rocks.length-1;i>=0;i--){const k=rocks[i],m=k.m;k.t+=dt;
  if(k.st==='fall'){k.vy-=16*dt;m.position.y+=k.vy*dt;m.position.x+=(0-m.position.x)*dt*3;m.rotation.x+=dt*5;m.rotation.z+=dt*3;
   if(m.position.y<=lv+.1&&lv>.1){ripple(m.position.x,0);for(let j=0;j<14;j++)grain.emit({x:m.position.x,y:lv,z:0,vx:rnd(-1.2,1.2),vy:rnd(1.5,3),vz:rnd(-1.2,1.2),life:.7,size:.06,c0:[.9,.95,1],g:-9,a:.8});k.st='sink';k.vy=-.4}
   else if(m.position.y<=.3){m.position.y=.27;k.st='rest'}
   if(k.st!=='fall'&&!k.pushed){k.pushed=true;st.contents.push(k.id);labels();check()}}
  else if(k.st==='sink'){m.position.y+=k.vy*dt*1.5;m.rotation.y+=dt;if(m.position.y<=.28){m.position.y=.27;k.st='rest'}}
  else if(k.st==='float'){m.position.y=lv+.1;m.position.x=Math.sin(time*5)*.6*Math.cos(time*1.7);m.position.z=Math.cos(time*4.1)*.5;m.rotation.y+=dt*8}
  if(k.dis&&st.rx){const f=Math.max(0,1-st.rx.t/(st.rx.r.dur*.9));m.scale.setScalar(Math.max(.001,f))}
  if(k.dis&&!st.rx){S.remove(m);m.geometry.dispose();m.material.dispose();rocks.splice(i,1)}}
 /* phản ứng đang diễn ra */
 if(st.rx){const r=st.rx.r;st.rx.t+=dt;const p=Math.min(1,st.rx.t/r.dur);
  st.bub=Math.sin(Math.PI*Math.min(1,p*1.1))**.7*(r.bub||0);st.fire=r.fire?Math.max(0,Math.sin(Math.PI*Math.min(1,p*1.05)**.6)):0;
  if(r.precip&&lv>.1){const count=Math.max(1,Math.floor(22*dt));for(let i=0;i<count;i++)grain.emit({x:rnd(-.82,.82),y:rnd(.12,Math.max(.18,lv*.82)),z:rnd(-.7,.7),vx:rnd(-.12,.12),vy:rnd(-.05,.12),vz:rnd(-.12,.12),life:rnd(2.8,5.5),size:rnd(.07,.15),c0:rgb(r.precip),a:.95,g:-.20})}
  if(p>=1){st.rx=null;st.fire=0;st.hint=3}}
 else if(st.hint>0){st.hint-=dt;st.bub=Math.max(0,st.bub-dt*.4)}else st.bub=Math.max(0,st.bub-dt*.5);
 /* bọt khí trong dung dịch */
 if(lv>.2){const n=st.bub*(st.heat?55:40)*dt+Math.random();const gasColors={H2:'#dbe8f5',CO2:'#d8e0e8',O2:'#bfeaff',SO2:'#d7cfb5',NO2:'#a95b31',NH3:'#e4e0d5'};const gc=rgb(gasColors[st.gasType]||'#e7f1fb');for(let i=0;i<Math.floor(n*(st.bub>.02?1:0));i++){const a=rnd(6.28),rr=Math.sqrt(Math.random())*1.25;
  bub.emit({x:Math.cos(a)*rr,y:rnd(.15,Math.max(.2,lv*.6)),z:Math.sin(a)*rr,vx:rnd(-.1,.1),vy:rnd(.4,1.1)+st.bub*.3,life:8,size:rnd(.05,.17),c0:gc,a:.75})}}
 /* lửa trên miệng cốc (kim loại kiềm) */
 if(st.fire>.02){const n=Math.round(340*st.fire*dt*(.5+Math.random()));for(let i=0;i<n;i++){const a=rnd(6.28),rr=Math.sqrt(Math.random())*.9*(.4+st.fire*.6);
  fire.emit({x:Math.cos(a)*rr,y:lv+.1,z:Math.sin(a)*rr,vx:rnd(-.3,.3),vy:rnd(2.2,4),vz:rnd(-.3,.3),life:rnd(.9,1.6),size:rnd(.7,1.3),c0:[1,.75,.3],c1:[.75,.08,.04],a:.4*st.fire+.1,grow:.4})}
  for(let i=0;i<Math.round(80*st.fire*dt*60/60);i++)spark.emit({x:rnd(-.7,.7),y:lv+.2,z:rnd(-.7,.7),vx:rnd(-1.5,1.5),vy:rnd(2,6),vz:rnd(-1.5,1.5),life:rnd(1,2.2),size:rnd(.05,.1),c0:[1,.85,.5],c1:[1,.2,.1],g:-1.5,a:.9})}
 /* ngọn lửa đun dưới đáy cốc */
 if(st.heat){const n=Math.round(220*dt*(.7+Math.random()*.6));for(let i=0;i<n;i++)fire.emit({x:rnd(-.3,.3),y:-.9,z:rnd(-.2,.2),vx:rnd(-.1,.1),vy:rnd(1.2,2.2),vz:rnd(-.1,.1),life:rnd(.45,.8),size:rnd(.45,.8),c0:[1,.88,.45],c1:[.9,.25,.05],a:.5,grow:-.3})}
 for(let i=rings.length-1;i>=0;i--){const g=rings[i];g.t+=dt*1.4;g.m.scale.setScalar(.1+g.t*1.3);g.m.material.opacity=.5*(1-g.t);g.m.position.y=lv+.02;
  if(g.t>=1){S.remove(g.m);g.m.geometry.dispose();g.m.material.dispose();rings.splice(i,1)}}
 /* đổ bỏ dung dịch (nút cửa) */
 if(st.pour){const p=st.pour;p.t+=dt;const a=Math.min(.85,p.t<.8?p.t/.8*.85:p.t<2.6?.85:(3.4-p.t)/.8*.85);bk.rotation.x=Math.max(0,a);
  if(p.t>.8&&!p.go){p.go=1;lvT=0;st.rx=null;st.fire=0;st.contents=[];st.ovr=null;st.gasType=null;clearSediment();labels();eqEl.innerHTML='';rocks.splice(0).forEach(k=>{S.remove(k.m);k.m.geometry.dispose();k.m.material.dispose()})}
  if(p.t>.8&&p.t<2.4&&lv>.05){const c=[st.col.r,st.col.g,st.col.b];for(let i=0;i<10;i++)grain.emit({x:rnd(-.2,.2),y:1.15,z:3.45,vx:0,vy:-.5,vz:rnd(.8,1.6),life:1.2,size:rnd(.07,.12),c0:c,g:-9,a:.9})}
  if(p.t>3.4){st.pour=null;bk.rotation.x=0}}
 fire.update(dt);spark.update(dt);bub.update(dt);grain.update(dt);R.render(S,cam)}
requestAnimationFrame(frame);

/* ============ ui.js ============ */
const cat=$('#cat'),grid=$('#grid'),q=$('#q'),shade=(h,k)=>'#'+[1,3,5].map(i=>Math.min(255,Math.round(parseInt(h.slice(i,i+2),16)*k)).toString(16).padStart(2,'0')).join('');
function icon(d){const c=d.c;
 if(d.t==='l')return`<svg viewBox="0 0 44 44"><path d="M17 3h10v13l11 19a4.5 4.5 0 0 1-4 6.5H10A4.5 4.5 0 0 1 6 35l11-19z" fill="${c}"/><path d="M19 5h2v12L10 36" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none"/><ellipse cx="22" cy="3.5" rx="6" ry="1.6" fill="${shade(c,.8)}"/></svg>`;
 if(d.t==='g')return`<svg viewBox="0 0 44 44"><circle cx="20" cy="30" r="9" fill="url(#sm)"/><circle cx="26" cy="19" r="8" fill="url(#sm)"/><circle cx="19" cy="9" r="6" fill="url(#sm)"/><circle cx="24" cy="38" r="5" fill="url(#sm)"/></svg>`;
 const pg=d.t==='e'?['6,28 14,10 30,5 40,19 34,36 14,38','14,10 30,5 26,22 6,28','26,22 40,19 34,36 14,38 6,28']:['5,26 15,8 31,8 40,26 24,39','15,8 31,8 27,24 5,26','27,24 40,26 24,39 5,26'];
 return`<svg viewBox="0 0 44 44"><polygon points="${pg[0]}" fill="${c}"/><polygon points="${pg[1]}" fill="${shade(c,1.25)}"/><polygon points="${pg[2]}" fill="${shade(c,.72)}"/></svg>`}
const filters=$('#filters');
let activeCategory='all';
const acidIds=new Set(['HCl','H2SO4','H2SO4 (đặc)','HNO3','HNO3 (đặc)','H3PO4','H2CO3','CH3COOH','H2SO3','HBr','HF','HClO','HClO3','HClO4','H2SiO3','H2SiF6','H2S']);
const oxideIds=new Set(['H2O','H2O2','CO2','CO','SO2','SO3','NO','NO2','CaO','MgO','CuO','Cu2O','FeO','Fe2O3','Fe3O4','ZnO','Al2O3','MnO2','SiO2','Na2O','Na2O2','K2O']);
const baseIds=new Set(['LiOH','NaOH','KOH','Ca(OH)2','Ba(OH)2','Mg(OH)2','Al(OH)3','Fe(OH)2','Fe(OH)3','Cu(OH)2','Zn(OH)2','NH3(aq)','NH3']);
const elementalMolecules=new Set(['H2','O2','N2','Cl2','I2','Br2','F2','P (white)','S']);
function categoryOf(d){if(acidIds.has(d.id))return'acids';if(baseIds.has(d.id))return'bases';if(oxideIds.has(d.id))return'oxides';if(d.t==='e'||elementalMolecules.has(d.id))return'elements';if(d.t==='g')return'gases';return'salts'}
const categoryList=[['all','Tất cả'],['elements','Nguyên tố'],['acids','Axit'],['bases','Bazơ'],['salts','Muối'],['oxides','Oxit'],['gases','Chất khí']];
function renderFilters(){filters.innerHTML=categoryList.map(([id,label])=>`<button type="button" data-cat="${id}" class="${activeCategory===id?'active':''}">${label}</button>`).join('')}
filters.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;activeCategory=b.dataset.cat;renderFilters();render()});
function render(){const raw=q.value.trim(),s=nz(raw),sn=s.replace(/[\s().·]/g,''),f0=nz(raw).replace(/[\s().·]/g,'');
 const l=DB.filter(d=>(!s||d.nf.includes(sn)||d.a.includes(s)||nz(d.f).replace(/[\s().·]/g,'').includes(f0))&&(activeCategory==='all'||categoryOf(d)===activeCategory));
 grid.innerHTML=l.length?l.map(d=>`<button class="t" data-id="${d.id}">${icon(d)}<span>${sub(d.f)}</span></button>`).join(''):'<div id="none">Không tìm thấy chất nào</div>'}
function openCat(o){cat.classList.toggle('open',o);cat.setAttribute('aria-hidden',!o);$('#b0').classList.toggle('on',o);if(o){render();grid.scrollTop=0}else q.blur()}
q.addEventListener('input',render);
grid.addEventListener('click',e=>{const b=e.target.closest('.t');if(!b)return;openCat(false);q.value='';add(b.dataset.id)});
$('#x').onclick=()=>openCat(false);
$('#b0').onclick=()=>openCat(!cat.classList.contains('open'));
$('#b1').onclick=()=>{st.heat=!st.heat;$('#b1').classList.toggle('on',st.heat)};
$('#b2').onclick=()=>{clearAll();st.heat=false;$('#b1').classList.remove('on');st.pour=null;bk.rotation.x=0;openCat(false)};
$('#b3').onclick=()=>{if(!st.pour&&(lv>.05||st.contents.length||rocks.length)){st.heat=false;$('#b1').classList.remove('on');st.pour={t:0}}};
addEventListener('keydown',e=>{if(e.key==='Escape')openCat(false)});
renderFilters();render();
  document.title=`Thí nghiệm hóa học 3D · ${DB.length} chất · ${RX.length} quy tắc phản ứng`;
